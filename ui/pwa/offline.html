<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14120f" />
  <title>TooPowerInbox · 離線 Offline</title>
  <link rel="icon" href="/icons/tpi.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #14120f; color: #f3eee6;
      font: 15px/1.6 "Iowan Old Style", "Source Han Serif TC", "Songti TC", Georgia, serif; }
    main { max-width: 440px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 24px 32px; text-align: center; }
    img { width: 84px; height: 84px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { color: #9a9186; margin: 8px 0; }
    button { margin-top: 18px; background: #c4a574; color: #1a140c; border: none; border-radius: 10px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; }
    .lang { margin-top: 26px; background: transparent; color: #9a9186; border: 1px solid #2c2722; font-weight: 400; padding: 6px 14px; font-size: 13px; }
    #note { min-height: 1.6em; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/tpi-192.png" alt="" />
    <h1 data-k="title">連不到 TooPowerInbox</h1>
    <p data-k="why">手機或電腦目前離線，或本機伺服器沒有在跑。</p>
    <p data-k="safe">為了保護隱私，App 只快取介面與圖示，不快取任何信件；恢復連線後就會載入。</p>
    <button id="retry" data-k="retry">重試</button>
    <p id="note"></p>
    <button class="lang" id="lang">English</button>
  </main>
  <script>
    "use strict";
    const S = {
      zh: {
        title: "連不到 TooPowerInbox", why: "手機或電腦目前離線，或本機伺服器沒有在跑。",
        safe: "為了保護隱私，App 只快取介面與圖示，不快取任何信件；恢復連線後就會載入。",
        retry: "重試", checking: "檢查連線中…", still: "還是連不到。確認伺服器（./run.sh）與網路後再試。", other: "English",
      },
      en: {
        title: "Can't reach TooPowerInbox", why: "This device is offline, or the local server isn't running.",
        safe: "For privacy the app caches only its interface and icons, never your mail; it loads again once you're back online.",
        retry: "Retry", checking: "Checking…", still: "Still unreachable. Check the server (./run.sh) and your network, then retry.", other: "繁體中文",
      },
    };
    let lang = localStorage.getItem("tpi-lang") === "en" ? "en" : "zh";
    const $ = (id) => document.getElementById(id);
    function apply() {
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.querySelectorAll("[data-k]").forEach((el) => { el.textContent = S[lang][el.dataset.k]; });
      $("lang").textContent = S[lang].other;
      $("note").textContent = "";
    }
    async function retry() {
      $("retry").disabled = true;
      $("note").textContent = S[lang].checking;
      try {
        const r = await fetch("/api/health", { cache: "no-store" });
        if (r.ok) { location.replace("/"); return; }
        throw new Error(String(r.status));
      } catch {
        $("note").textContent = S[lang].still;
      } finally {
        $("retry").disabled = false;
      }
    }
    $("retry").onclick = retry;
    $("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorage.setItem("tpi-lang", lang); apply(); };
    window.addEventListener("online", retry);
    apply();
  </script>
</body>
</html>
