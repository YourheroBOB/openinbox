<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TooPowerInbox</title>
  <style>
    :root {
      --bg: #14120f; --panel: #1c1916; --ink: #f3eee6; --muted: #9a9186;
      --line: #2c2722; --accent: #c4a574; --accent2: #dcc08c;
      --need: #d27a5a; --look: #c4a574; --fyi: #8a9aa8; --other: #6b6560; --up: #7ea07a;
      --ok: #7ea07a; --bad: #c0604f; --copilot-bg: #191612;
      --shadow: 0 18px 48px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Iowan Old Style", "Source Han Serif TC", "Songti TC", Georgia, serif; overflow: hidden; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #332d26; border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    #app { display: grid; grid-template-columns: 234px minmax(340px, 1fr) minmax(400px, 46vw); grid-template-rows: 100vh; height: 100vh; }
    aside, main, section { min-width: 0; min-height: 0; }
    aside { border-right: 1px solid var(--line); padding: 18px 12px 12px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .brand { font-size: 19px; letter-spacing: .04em; display: flex; align-items: baseline; gap: 8px; }
    .brand .logo { display: inline-flex; width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #8f7343); color: #17130c; font-weight: 700; align-items: center; justify-content: center; font-size: 14px; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 5px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav button { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .nav button:hover { background: #221e19; }
    .nav button.on { background: #2a241d; border-color: var(--line); }
    .nav .cnt { color: var(--muted); font-size: 12px; }
    .nav button.on .cnt { color: var(--accent); }
    .acct button { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 12.5px; line-height: 1.35; white-space: pre-line; }
    .acct button:hover { background: #221e19; }
    .acct button.on { background: #2a241d; color: var(--ink); border-color: var(--line); }
    .label { color: var(--muted); font-size: 10.5px; letter-spacing: .12em; margin: 2px 6px 4px; text-transform: uppercase; }
    .sidefoot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .chip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .chip .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
    .chip.ready .led { background: var(--ok); }
    .status { color: var(--muted); font-size: 11.5px; min-height: 1.2em; padding: 0 4px; }
    .langbtn { width: 100%; background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 6px; border-radius: 8px; font-size: 12px; }
    .langbtn:hover { color: var(--ink); border-color: var(--accent); }

    main { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .toolbar input { flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: 9px; outline: none; }
    .toolbar input:focus { border-color: #4a4136; }
    .btn { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 9px; white-space: nowrap; }
    .btn:hover { background: #262019; }
    .btn.primary { background: var(--accent); color: #1a140c; border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { background: var(--accent2); }
    .btn.ghost { border-color: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--ink); background: #221e19; }
    .tabs { display: flex; gap: 6px; padding: 10px 14px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    .tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
    .tabs button .n { font-size: 11px; color: var(--muted); }
    .tabs button.on { color: var(--ink); border-color: var(--accent); background: rgba(196,165,116,.08); }
    .tabs button.on .n { color: var(--accent); }
    .list { overflow: auto; flex: 1; min-height: 0; }
    .row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #221e1a; cursor: pointer; }
    .row > div { min-width: 0; }
    .row:hover { background: #1e1a15; }
    .row.on { background: #26211a; box-shadow: inset 3px 0 0 var(--accent); }
    .row .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--other); flex: none; }
    .dot.needs_you { background: var(--need); box-shadow: 0 0 5px rgba(210,122,90,.6); }
    .dot.worth_a_look { background: var(--look); }
    .dot.fyi { background: var(--fyi); }
    .dot.upcoming { background: var(--up); }
    .rowline { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .avatar { width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #17130c; font-family: -apple-system, sans-serif; font-weight: 600; }
    .from { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .row.unread .from { font-weight: 700; }
    .subj { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .meta { color: var(--muted); font-size: 11px; white-space: nowrap; text-align: right; line-height: 1.5; }
    .empty { padding: 40px 20px; color: var(--muted); text-align: center; }

    section { display: flex; flex-direction: column; background: #171410; position: relative; overflow: hidden; }
    .pane { padding: 18px 22px; overflow: auto; flex: 1; min-height: 0; }
    h2.mh { font-size: 17px; margin: 0 0 6px; line-height: 1.4; }
    .muted { color: var(--muted); }
    .actionbar { display: flex; gap: 7px; flex-wrap: wrap; margin: 12px 0 16px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .actionbar .btn { font-size: 12.5px; padding: 6px 11px; }
    .msg { margin: 0 0 18px; }
    .msg .msghead { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
    .msg .who { font-weight: 650; font-size: 13.5px; }
    .msg .when { color: var(--muted); font-size: 12px; }
    .msg .body { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; font-size: 14px; line-height: 1.7; color: #e8e1d4; }
    .msg.collapsed .body { max-height: 120px; overflow: hidden; position: relative; }
    .msg.collapsed .body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, #171410); }
    .body.md { white-space: normal; }
    .body.md .mdh { font-weight: 700; color: var(--accent2); margin: 10px 0 4px; }
    .body.md ul { margin: 4px 0; padding-left: 18px; }
    .expand { background: transparent; border: none; color: var(--accent); font-size: 12px; padding: 4px 0; }
    .board .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
    .card .muted { font-size: 12.5px; margin-top: 4px; }

    #copilot { position: absolute; inset: 0; left: 24%; background: var(--copilot-bg); border-left: 1px solid #3a332a; display: flex; flex-direction: column; transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 30; box-shadow: var(--shadow); }
    #copilot.open { transform: translateX(0); }
    .cp-head { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .cp-head .spark { font-size: 16px; }
    .cp-head .t { font-weight: 650; }
    .cp-head .sub { color: var(--muted); font-size: 11px; }
    .cp-head .x { margin-left: auto; background: transparent; border: none; color: var(--muted); font-size: 17px; padding: 2px 7px; border-radius: 6px; }
    .cp-head .x:hover { color: var(--ink); background: #2a241d; }
    .cp-context { display: flex; align-items: center; gap: 8px; margin: 10px 14px 0; padding: 7px 10px; border: 1px dashed #4a4136; border-radius: 8px; font-size: 12px; color: var(--accent2); background: rgba(196,165,116,.05); }
    .cp-context .cx { margin-left: auto; background: none; border: none; color: var(--muted); padding: 0 3px; }
    .cp-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .bubble { max-width: 92%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
    .bubble.user { align-self: flex-end; background: #2f2a1e; border: 1px solid #453b28; border-bottom-right-radius: 4px; }
    .bubble.ai { align-self: flex-start; background: #211d17; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .bubble.ai.fallback { border-color: #6b4a3a; }
    .bubble .fbnote { color: var(--need); font-size: 11px; margin-bottom: 6px; }
    .bubble h3.bh { font-size: 13.5px; margin: 8px 0 4px; color: var(--accent2); border-bottom: 1px dashed #3a332a; padding-bottom: 3px; }
    .bubble ul { margin: 4px 0; padding-left: 18px; }
    .bubble .draftacts { display: flex; gap: 6px; margin: 6px 0 10px; }
    .bubble .draftacts .btn { font-size: 11.5px; padding: 4px 9px; }
    .typing { align-self: flex-start; color: var(--muted); font-size: 12.5px; padding: 8px 4px; display: flex; gap: 4px; align-items: center; }
    .typing .d { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing .d:nth-child(2) { animation-delay: .2s; } .typing .d:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    .cp-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px 2px; }
    .cp-chips button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; font-size: 11.5px; padding: 4px 10px; }
    .cp-chips button:hover { color: var(--ink); border-color: var(--accent); }
    .cp-input { display: flex; gap: 8px; padding: 12px 14px 14px; }
    .cp-input textarea { flex: 1; height: 54px; resize: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; outline: none; }
    .cp-input .send { background: var(--accent); color: #1a140c; border: none; border-radius: 10px; padding: 0 16px; font-weight: 650; }
    .cp-input .send:disabled { opacity: .45; }

    #modalback { position: fixed; inset: 0; background: rgba(10,8,6,.62); display: none; align-items: center; justify-content: center; z-index: 60; }
    #modalback.open { display: flex; }
    .modal { width: min(640px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid #3a332a; border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
    .modal h3 { margin: 0 0 12px; font-size: 16px; }
    .modal .frow { display: flex; gap: 8px; margin-bottom: 10px; }
    .modal .frow input { flex: 1; background: #171410; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; }
    .modal textarea { width: 100%; min-height: 260px; background: #171410; border: 1px solid var(--line); border-radius: 8px; padding: 10px; outline: none; resize: vertical; line-height: 1.7; }
    .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .modal .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
    #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
    .toast { background: #242019; border: 1px solid #3a332a; border-left: 3px solid var(--accent); border-radius: 9px; padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow); animation: rise .25s ease; max-width: 340px; }
    .toast.err { border-left-color: var(--bad); }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    kbd { background: #26211b; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: -apple-system, sans-serif; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
    .brainform { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 18px; }
    .brainform input, .brainform textarea { background: #171410; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; }
    .brainform textarea { min-height: 70px; resize: vertical; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand"><span class="logo">TP</span><span>TooPowerInbox<small id="brandSub">本機大腦 · BYO Agent</small></span></div>
      <div class="nav" id="nav">
        <button class="on" data-view="mail" data-k="navMail">郵件 <span class="cnt" id="cnt-mail"></span></button>
        <button data-view="brain" data-k="navBrain">大腦看板 <span class="cnt" id="cnt-brain"></span></button>
        <button data-view="brain2" data-k="navBrain2">第二大腦 <span class="cnt" id="cnt-brain2"></span></button>
        <button data-view="calendar" data-k="navCal">日曆 <span class="cnt" id="cnt-cal"></span></button>
        <button data-view="drafts" data-k="navDrafts">草稿匣 <span class="cnt" id="cnt-drafts"></span></button>
      </div>
      <div>
        <div class="label" data-k="lblAccounts">信箱</div>
        <div class="acct" id="accounts"></div>
      </div>
      <div class="sidefoot">
        <div class="chip" id="agentChip"><span class="led"></span><span id="agentText">Agent…</span></div>
        <button class="langbtn" id="langBtn" title="繁中 / EN">English</button>
        <div class="status" id="syncStatus"></div>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <input id="q" placeholder="搜尋本機快取" />
        <button class="btn primary" id="syncBtn" data-k="btnSync">同步</button>
        <button class="btn" id="cpBtn">✦ Copilot</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="list" id="list"></div>
    </main>

    <section>
      <div class="pane" id="pane"></div>
      <div id="copilot">
        <div class="cp-head">
          <span class="spark">✦</span>
          <div><div class="t">Copilot</div><div class="sub" id="cpSub"></div></div>
          <button class="x" id="cpClose">✕</button>
        </div>
        <div class="cp-context" id="cpContext" style="display:none">
          <span>📎</span><span id="cpCtxText" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
          <button class="cx" id="cpCtxClear">✕</button>
        </div>
        <div class="cp-msgs" id="cpMsgs"></div>
        <div class="cp-chips" id="cpChips"></div>
        <div class="cp-input">
          <textarea id="cpAsk" placeholder=""></textarea>
          <button class="send" id="cpSend" data-k="btnSend">送出</button>
        </div>
      </div>
    </section>
  </div>

  <div id="modalback">
    <div class="modal">
      <h3 id="mTitle" data-k="mTitle">回信草稿</h3>
      <div class="frow"><input id="mTo" placeholder="To" /></div>
      <div class="frow"><input id="mSubject" placeholder="Subject" /></div>
      <textarea id="mBody"></textarea>
      <div class="acts">
        <button class="btn ghost" id="mCancel" data-k="btnCancel">取消</button>
        <button class="btn" id="mCopy" data-k="btnCopy">複製全文</button>
        <button class="btn primary" id="mSave" data-k="btnSave">存入本機草稿匣</button>
      </div>
      <div class="note" data-k="mNote">草稿只存在本機資料庫。TooPowerInbox 設計上不寄信。</div>
    </div>
  </div>
  <div id="toasts"></div>

  <script>
    "use strict";
    const state = {
      view: "mail", account: "", category: "all", q: "",
      emails: [], selected: null, selIdx: -1, brain: null, drafts: [], calEvents: [], brainCards: [],
      cpOpen: false, cpBusy: false, cpHistory: [], cpUseSelection: true,
      lang: localStorage.getItem("tpi-lang") || "zh",
      cfg: null,
    };
    const $ = (id) => document.getElementById(id);
    const api = async (path, opt) => (await fetch(path, opt)).json();
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDT = (s) => String(s ?? "").replace(/(\d)T(\d)/g, "$1 $2");
    const zh = () => state.lang === "zh";

    const S = {
      zh: {
        brandSub: "本機大腦 · BYO Agent", navMail: "郵件", navBrain: "大腦看板", navBrain2: "第二大腦",
        navCal: "日曆", navDrafts: "草稿匣", lblAccounts: "信箱", allAccounts: "所有收件匣",
        btnSync: "同步", btnSend: "送出", btnCancel: "取消", btnCopy: "複製全文", btnSave: "存入本機草稿匣",
        mTitle: "回信草稿", mNote: "草稿只存在本機資料庫。TooPowerInbox 設計上不寄信。",
        search: "搜尋本機快取：寄件人、主旨、摘要（按 / 聚焦）",
        cats: { all: "全部", needs_you: "需要你", upcoming: "今天之後", worth_a_look: "值得看", fyi: "僅供參考", other: "可清掉" },
        cpAsk: "問我任何關於信箱的事…（Enter 送出／Shift+Enter 換行）",
        cpWelcome: "我是信箱 Copilot。可以問我信箱的事，或點下面的快捷鍵。正在看的信會自動變成我的參考資料。",
        cpSummarize: "✦ 30 秒摘要", cpTodos: "⚑ 待辦與期限", cpDraft: "✎ 回信草稿×3",
        cpCopyBody: "複製內文", cpMarkUnread: "標成未讀",
        chips: [
          { t: "晨間速覽", ask: "把上次工作日之後進信箱的信，依「需要你／值得看／僅供參考」整理成晨間速覽；「需要你」的要寫到我能直接決定。" },
          { t: "這陣子發生什麼", ask: "用寄件人與主題把最近的信箱活動收成幾組；先講要回的，再講可以掃過的。" },
          { t: "收件匣分類", ask: "把最近的信分成需要你、值得看、僅供參考、可清掉，並點名最大的噪音來源。" },
          { t: "本週怎麼排", ask: "把行事曆與信箱待辦合成一張本週圖：會議、截止、還有卡住的回信。" },
        ],
        emptyList: "這個分類沒有信。按「同步」抓信件；demo 模式已有種子信。", noEvents: "尚無事件，按「同步」抓日曆。",
        emptyDrafts: "草稿匣是空的。開一封信按「回信草稿×3」，Copilot 會幫你起草。", noCards: "還沒有第二大腦卡片。",
        draftsTitle: "本機草稿匣", draftsHint: "草稿只存在這台機器；設計上不自動寄信。",
        welcomeTitle: "TooPowerInbox · 本機 GenMail 式郵件大腦",
        welcomeHint: "按 c 打開 Copilot 抽屜，直接用自然語言問信箱的事。",
        edit: "編輯", del: "刪除", copied: "已複製到剪貼簿", copyFail: "複製失敗，請手動選取",
        saved: "已存入本機草稿匣", saveFail: "儲存失敗", deleted: "草稿已刪除", callFail: "呼叫失敗：",
        fbNote: "⚠ 未接 LLM（本機啟發式結果）— 在 agent.json 設定 driver 可升級",
        synced: "同步完成", syncing: "同步中…", lastSync: "上次同步", thinking: "思考中",
        showFull: "顯示全文", chars: "字", editDraft: "✎ 編輯草稿", saveDraftNow: "直接存草稿匣",
        draftASaved: "草稿已存入草稿匣", brainTitle: "第二大腦與更了解你", cardTitle: "標題", cardBody: "內容",
        addCard: "新增卡片", persona: "更了解你", rebuildHint: "同步後自動重建；也可手動 POST /api/rebuild。",
        agentLocal: "Copilot：本機啟發式（agent.json 可接 LLM）",
      },
      en: {
        brandSub: "Local brain · BYO Agent", navMail: "Mail", navBrain: "Triage board", navBrain2: "Second brain",
        navCal: "Calendar", navDrafts: "Drafts", lblAccounts: "Accounts", allAccounts: "All inboxes",
        btnSync: "Sync", btnSend: "Send", btnCancel: "Cancel", btnCopy: "Copy all", btnSave: "Save to local drafts",

    function globalKeys(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
        if (e.key === "Escape") e.target.blur();
        return;
      }
      if (e.key === "Escape") { if ($("modalback").classList.contains("open")) closeModal(); else toggleCopilot(false); }
      else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
      else if (e.key === "c") toggleCopilot();
      else if (e.key === "j" || e.key === "k") {
        if (state.view !== "mail" || !state.emails.length) return;
        e.preventDefault();
        const dir = e.key === "j" ? 1 : -1;
        state.selIdx = Math.max(0, Math.min(state.emails.length - 1, state.selIdx + dir));
        const rows = $("list").querySelectorAll(".row");
        rows.forEach((r, i) => r.classList.toggle("on", i === state.selIdx));
        const el = rows[state.selIdx];
        if (el) el.scrollIntoView({ block: "nearest" });
      }
      else if (e.key === "Enter") {
        if (state.view === "mail" && state.selIdx >= 0 && state.emails[state.selIdx]) openThread(state.emails[state.selIdx].id);
      }
    }

    function mdHtml(src) {
      const lines = String(src || "").split("\n");
      let html = "", list = null;
      const flush = () => { if (list) { html += "</ul>"; list = null; } };
      for (const ln of lines) {
        const mH = ln.match(/^\s{0,3}#{1,4}\s+(.*)$/);
        const mB = ln.match(/^\s{0,3}[-*•]\s+(.*)$/);
        const mN = ln.match(/^\s{0,3}\d+[.、]\s+(.*)$/);
        const mQ = ln.match(/^\s{0,3}>\s?(.*)$/);
        if (mH) { flush(); html += `<div class="mdh">${inline(mH[1])}</div>`; }
        else if (mB || mN) { if (!list) { flush(); html += "<ul>"; list = true; } html += `<li>${inline(mB ? mB[1] : mN[1])}</li>`; }
        else if (mQ) { flush(); html += `<div class="mdq" style="color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:4px 0">${inline(mQ[1])}</div>`; }
        else if (ln.trim() === "---") { flush(); html += `<hr style="border:none;border-top:1px solid var(--line);margin:10px 0">`; }
        else if (!ln.trim()) { flush(); }
        else { flush(); html += `<div>${inline(ln)}</div>`; }
      }
      flush();
      return html;
    }
    function inline(s) {
      return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code style='background:#26211b;padding:0 4px;border-radius:3px;font-size:12px'>$1</code>");
    }

        </div>`).join("") || `<div class='empty'>${esc(T("emptyDrafts"))}</div>`;
      $("pane").innerHTML = `<h2 class="mh">${esc(T("draftsTitle"))}</h2>
        <p class="muted">${state.drafts.length} · ${esc(T("draftsHint"))}</p>`;
    }
    window.showDraft = (idx) => {
      const d = state.drafts[idx]; if (!d) return;
      $("pane").innerHTML = `<h2 class="mh">${esc(d.subject || "")}</h2>
        <p class="muted">${esc(d.to_addr || "—")}　·　${esc(d.created_at || "")}</p>
        <div class="actionbar">
          <button class="btn" onclick="showDraftEditor(${idx})">${esc(T("edit"))}</button>
          <button class="btn ghost" onclick="copyText(state.drafts[${idx}].body, null)">${esc(T("btnCopy"))}</button>
          <button class="btn ghost" onclick="delDraft(${d.id})">${esc(T("del"))}</button>
        </div>
        <div class="msg"><div class="body">${esc(d.body || "")}</div></div>`;
    };
    window.delDraft = async (id) => {
      await api("/api/draft?id=" + id, { method: "DELETE" }).catch(() => {});
      toast(T("deleted")); loadDrafts(); refreshCounts();
    };

    window.showDraftEditor = (idx) => { const d = state.drafts[idx]; if (d) openDraftModal(d); };
    window.openDraftModal = (d) => {
      $("mTo").value = d?.to_addr || (state.selected ? ((state.selected.from_addr || "").match(/<([^>]+)>/)?.[1] || state.selected.from_addr || "") : "");
      $("mSubject").value = d?.subject || (state.selected ? "Re: " + (state.selected.subject || "") : "");
      $("mBody").value = d?.body || "";
      $("mSave").dataset.editId = d?.id || "";
      $("modalback").classList.add("open");
      $("mBody").focus();
    };
    function closeModal() { $("modalback").classList.remove("open"); }
    async function saveModalDraft() {
      const account = state.selected?.account || state.account || (state.cfg.accounts?.[0]?.email) || "you@example.com";
      const body = { account, to: $("mTo").value.trim(), subject: $("mSubject").value.trim(), body: $("mBody").value, lang: zh() ? "zh-Hant" : "en" };
      const editId = $("mSave").dataset.editId;
      if (editId) await api("/api/draft?id=" + editId, { method: "DELETE" }).catch(() => {});
      const r = await api("/api/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);
      if (r && !r.error) { toast(T("saved")); closeModal(); refreshCounts(); }
      else toast(T("saveFail"), true);
    }

    /* ── copilot ── */
    function toggleCopilot(force) {
      const open = force !== undefined ? force : !state.cpOpen;
      state.cpOpen = open;
      $("copilot").classList.toggle("open", open);
      if (open && !$("cpMsgs").children.length) bubble("ai", T("cpWelcome"));
      if (open) $("cpAsk").focus();
    }
    function renderCpContext() {
      const has = !!(state.selected && state.cpUseSelection);
      $("cpContext").style.display = has ? "flex" : "none";
      if (has) $("cpCtxText").textContent = (state.selected.subject || "").slice(0, 46);
    }
    function bubble(kind, text, opts = {}) {
      const d = document.createElement("div");
      d.className = "bubble " + kind + (opts.fallback ? " fallback" : "");
      if (opts.fallback) d.innerHTML = `<div class="fbnote">${esc(T("fbNote"))}</div>`;
      d.appendChild(renderMd(text, opts.drafts));
      $("cpMsgs").appendChild(d);
      $("cpMsgs").scrollTop = $("cpMsgs").scrollHeight;
    }
    function renderMd(text, withDraftButtons) {
      const wrap = document.createElement("div");
      const lines = String(text || "").split("\n");
      let html = "", list = null;
      const flush = () => { if (list) { html += "</ul>"; list = null; } };
      for (const ln of lines) {
        const mH = ln.match(/^#{1,3}\s*(.+)$/);
        const mB = ln.match(/^\s*[-*•]\s+(.+)$/);
        const mN = ln.match(/^\s*\d+[.、]\s+(.+)$/);
        if (mH) {
          flush();
          const label = mH[1].trim();
          html += `<h3 class="bh">${esc(label)}</h3>`;
          const isDraft = withDraftButtons && /^([ABC])[.、:：\s]/.test(label);
          if (isDraft) html += `<div class="draftacts"><button class="btn" data-dact="edit" data-tag="${RegExp.$1}">${esc(T("editDraft"))}</button><button class="btn ghost" data-dact="save" data-tag="${RegExp.$1}">${esc(T("saveDraftNow"))}</button></div>`;
        } else if (mB || mN) {
          if (!list) { flush(); html += "<ul>"; list = true; }
          html += `<li>${inline(mB ? mB[1] : mN[1])}</li>`;
        } else if (!ln.trim()) { flush(); }
        else { flush(); html += `<div>${inline(ln)}</div>`; }
      }
      flush();
      wrap.innerHTML = html;
      if (withDraftButtons) {
        const sections = splitDrafts(text);
        wrap.querySelectorAll("[data-dact]").forEach((b) => {
          const sect = sections[b.dataset.tag] || "";
          b.onclick = () => {
            const item = state.selected || {};
            if (b.dataset.dact === "edit") openDraftModal({ subject: "Re: " + (item.subject || ""), body: sect });
            else {
              api("/api/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ account: item.account || "you@example.com", to: (item.from_addr || "").match(/<([^>]+)>/)?.[1] || item.from_addr || "", subject: "Re: " + (item.subject || ""), body: sect, lang: zh() ? "zh-Hant" : "en" }) })
                .then(() => { toast(T("draftASaved")); refreshCounts(); })
                .catch(() => toast(T("saveFail"), true));
            }
          };
        });
      }
      return wrap;
    }
    function splitDrafts(text) {
      const out = {};
      const re = /^#{1,3}\s*([ABC])[.、:：\s]*(.*)$/gm;
      let m, starts = [];
      while ((m = re.exec(text))) starts.push({ tag: m[1], idx: m.index });
      starts.forEach((s, i) => {
        const end = i + 1 < starts.length ? starts[i + 1].idx : text.length;
        out[s.tag] = text.slice(s.idx, end).replace(/^#{1,3}\s*[ABC][.、:：\s]*.*$\n?/m, "").trim();
      });
      return out;
    }

    async function cpAction(mode) {
      if (!state.selected) return;
      toggleCopilot(true);
      state.cpUseSelection = true; renderCpContext();
      const label = { summarize: T("cpSummarize"), todos: T("cpTodos"), draft: T("cpDraft") }[mode] || mode;
      bubble("user", label + "｜" + (state.selected.subject || "").slice(0, 40));
      await runCopilot(mode, "");
    }
    async function sendChat() {
      const ask = $("cpAsk").value.trim();
      if (!ask || state.cpBusy) return;
      $("cpAsk").value = "";
      bubble("user", ask);
      await runCopilot("chat", ask);
    }
    async function runCopilot(mode, ask) {
      if (state.cpBusy) return;
      state.cpBusy = true; $("cpSend").disabled = true;
      const t = document.createElement("div");
      t.className = "typing"; t.innerHTML = "<span class='d'></span><span class='d'></span><span class='d'></span>&nbsp;" + esc(T("thinking"));
      $("cpMsgs").appendChild(t); $("cpMsgs").scrollTop = $("cpMsgs").scrollHeight;
      const itemId = (state.selected && state.cpUseSelection) ? state.selected.id : "";
      const data = await api("/api/copilot", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode, ask, item_id: itemId, history: state.cpHistory.slice(-8), lang: zh() ? "zh-Hant" : "en" }),
      }).catch(() => ({ error: "network" }));
      t.remove();
      state.cpBusy = false; $("cpSend").disabled = false;
      if (mode === "chat" && ask) state.cpHistory.push({ role: "user", text: ask });
      if (data.error) { bubble("ai", T("callFail") + data.error, { fallback: true }); return; }
      state.cpHistory.push({ role: "model", text: (data.text || "").slice(0, 1500) });
      if (state.cpHistory.length > 10) state.cpHistory = state.cpHistory.slice(-10);
      bubble("ai", data.text || "—", { fallback: data.fallback, drafts: mode === "draft" });
    }

    function renderChips() {
      const chips = zh() ? S.zh.chips : S.en.chips;
      $("cpChips").innerHTML = chips.map((c, i) => `<button data-i="${i}">${esc(c.t)}</button>`).join("");
      $("cpChips").onclick = (e) => {
        const b = e.target.closest("button"); if (!b || state.cpBusy) return;
        const c = chips[parseInt(b.dataset.i, 10)];
        state.cpUseSelection = false; renderCpContext();
        bubble("user", c.t);
        runCopilot("chat", c.ask);
      };
    }

    async function startSync() {
      $("syncStatus").textContent = T("syncing");
      await api("/api/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {});
      let n = 0;
      const t = setInterval(async () => {
        n += 1;
        const h = await api("/api/health").catch(() => null);
        if (!h || !h.sync?.running || n > 40) {
          clearInterval(t);
          $("syncStatus").textContent = h?.sync?.last ? T("lastSync") + " " + h.sync.last : (h?.sync?.error || T("synced"));
          toast(T("synced"));
          loadInbox(); refreshCounts();
        }
      }, 1500);
    }
    function updateAgentChip(h) {
      const driver = h?.agent || "local";
      const live = driver && driver !== "local";
      $("agentChip").classList.toggle("ready", !!live);
      $("agentText").textContent = live ? `Copilot: ${driver}` : T("agentLocal");
      $("cpSub").textContent = live ? `BYO agent · ${driver}` : (zh() ? "本機啟發式" : "local heuristic");
    }
    async function pollHealth() {
      const h = await api("/api/health").catch(() => null);
      if (!h) return;
      updateAgentChip(h);
      if (h.sync?.running) $("syncStatus").textContent = T("syncing");
      else if (h.sync?.last) $("syncStatus").textContent = T("lastSync") + " " + h.sync.last;
    }

    renderChips();
    boot();
  </script>
</body>
</html>
