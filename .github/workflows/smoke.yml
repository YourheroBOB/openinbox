name: smoke
on:
  push:
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./install.sh
      - run: python3 -m unittest discover -s tests
      - run: OPENINBOX_NO_BROWSER=1 ./run.sh &
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS http://127.0.0.1:8770/api/health && exit 0
            sleep 1
          done
          exit 1
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          h = json.loads(urllib.request.urlopen("http://127.0.0.1:8770/api/health").read())
          assert h["name"] == "TooPowerInbox"
          def run(body):
              req = urllib.request.Request(
                  "http://127.0.0.1:8770/api/v1/agent/run",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              return json.loads(urllib.request.urlopen(req).read())
          en = run({"skill": "morning-brief", "lang": "en"})
          zh = run({"skill": "morning-brief", "lang": "zh-Hant"})
          assert "Needs you" in en["answer"]
          assert "需要你" in zh["answer"]
          def copilot(body):
              req = urllib.request.Request(
                  "http://127.0.0.1:8770/api/copilot",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              return json.loads(urllib.request.urlopen(req).read())
          co = copilot({"mode": "summarize", "lang": "en"})
          assert co.get("mode") == "summarize" and len(co.get("text") or "") > 10
          html = urllib.request.urlopen("http://127.0.0.1:8770/").read().decode()
          assert "TooPowerInbox" in html and "繁中" in html
          PY
